<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Physics Scene</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        #ui h1 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        #ui p {
            margin: 5px 0;
            line-height: 1.6;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 8px;
            text-align: center;
            z-index: 100;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="loading">
        <p>Loading scene...</p>
    </div>

    <div id="ui">
        <h1>Physics Viewer</h1>
        <p>Click objects to apply force</p>
        <p>Right-click + drag to rotate camera</p>
        <p id="fps">FPS: --</p>
    </div>

    <!-- CDN Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@react-three/rapier@0.13.2/build/index.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/rapier3d-compat@0.0.14/rapier.js"></script>

    <script>
        // ============================================
        // SCENE SETUP
        // ============================================

        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.Fog(0x1a1a2e, 100, 1000);

        // Camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 15);
        camera.lookAt(0, 0, 0);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowShadowMap;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.far = 50;
        directionalLight.shadow.camera.left = -30;
        directionalLight.shadow.camera.right = 30;
        directionalLight.shadow.camera.top = 30;
        directionalLight.shadow.camera.bottom = -30;
        scene.add(directionalLight);

        // ============================================
        // PHYSICS WORLD
        // ============================================

        let world;
        const rigidBodies = []; // Track physics bodies

        async function initPhysics() {
            await Rapier.init(); // Wait for WASM to load
            world = new Rapier.World(new Rapier.Vector3(0, -9.81, 0));
            console.log('Rapier physics initialized');
        }

        // ============================================
        // CREATE TEST SCENE
        // ============================================

        function createTestScene() {
            // Ground plane
            const groundGeometry = new THREE.PlaneGeometry(50, 50);
            const groundMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x333333,
                roughness: 0.8,
                metalness: 0.2
            });
            const groundMesh = new THREE.Mesh(groundGeometry, groundMaterial);
            groundMesh.rotation.x = -Math.PI / 2;
            groundMesh.castShadow = true;
            groundMesh.receiveShadow = true;
            scene.add(groundMesh);

            // Static ground physics
            const groundShape = new Rapier.Cuboid(25, 0.1, 25);
            const groundBody = world.createRigidBody(Rapier.RigidBodyDesc.fixed());
            groundBody.createCollider(groundShape);

            // Falling cubes
            for (let i = 0; i < 3; i++) {
                addPhysicsBox(
                    {
                        position: { x: (i - 1) * 4, y: 5 + i * 2, z: 0 },
                        scale: { x: 1, y: 1, z: 1 }
                    }
                );
            }

            // Falling sphere
            addPhysicsSphere(
                {
                    position: { x: 0, y: 12, z: 5 },
                    radius: 1
                }
            );

            console.log('Test scene created');
        }

        // ============================================
        // PHYSICS BODY CREATORS
        // ============================================

        function addPhysicsBox(config) {
            const { position, scale } = config;

            // Three.js mesh
            const geometry = new THREE.BoxGeometry(scale.x * 2, scale.y * 2, scale.z * 2);
            const material = new THREE.MeshStandardMaterial({
                color: Math.random() * 0xffffff,
                roughness: 0.6,
                metalness: 0.3
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(position.x, position.y, position.z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            // Rapier physics body
            const shape = new Rapier.Cuboid(scale.x, scale.y, scale.z);
            const bodyDesc = Rapier.RigidBodyDesc.dynamic()
                .setTranslation(position.x, position.y, position.z);
            const body = world.createRigidBody(bodyDesc);
            const collider = body.createCollider(shape);
            collider.setRestitution(0.5);
            collider.setFriction(0.5);

            // Link mesh to physics body
            rigidBodies.push({ mesh, body });

            return { mesh, body };
        }

        function addPhysicsSphere(config) {
            const { position, radius } = config;

            // Three.js mesh
            const geometry = new THREE.SphereGeometry(radius, 32, 32);
            const material = new THREE.MeshStandardMaterial({
                color: Math.random() * 0xffffff,
                roughness: 0.4,
                metalness: 0.5
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(position.x, position.y, position.z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            // Rapier physics body
            const shape = new Rapier.Ball(radius);
            const bodyDesc = Rapier.RigidBodyDesc.dynamic()
                .setTranslation(position.x, position.y, position.z);
            const body = world.createRigidBody(bodyDesc);
            const collider = body.createCollider(shape);
            collider.setRestitution(0.7);
            collider.setFriction(0.3);

            rigidBodies.push({ mesh, body });

            return { mesh, body };
        }

        // ============================================
        // INTERACTION: RAYCASTING + FORCE
        // ============================================

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            // Normalize mouse coordinates
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // Raycast from camera
            raycaster.setFromCamera(mouse, camera);

            // Check all Three.js meshes
            const intersects = raycaster.intersectObjects(scene.children);

            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;

                // Find corresponding physics body
                const rigidBody = rigidBodies.find(rb => rb.mesh === clickedMesh);

                if (rigidBody && rigidBody.body.isDynamic()) {
                    // Apply upward impulse
                    const impulse = new Rapier.Vector3(0, 10, 0);
                    rigidBody.body.applyImpulse(impulse, true);
                    console.log('Impulse applied to:', clickedMesh);
                }
            }
        });

        // ============================================
        // CAMERA CONTROLS (Orbit with right-click)
        // ============================================

        let isRightMouseDown = false;
        let previousMousePosition = { x: 0, y: 0 };
        const cameraOrbit = { x: 0, y: 0 };

        window.addEventListener('mousedown', (e) => {
            if (e.button === 2) isRightMouseDown = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', (e) => {
            if (isRightMouseDown) {
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                cameraOrbit.y += deltaX * 0.005;
                cameraOrbit.x += deltaY * 0.005;

                const radius = 15;
                camera.position.x = Math.sin(cameraOrbit.y) * Math.cos(cameraOrbit.x) * radius;
                camera.position.y = Math.sin(cameraOrbit.x) * radius + 5;
                camera.position.z = Math.cos(cameraOrbit.y) * Math.cos(cameraOrbit.x) * radius;
                camera.lookAt(0, 2, 0);
            }
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => {
            isRightMouseDown = false;
        });

        window.addEventListener('contextmenu', (e) => e.preventDefault());

        // ============================================
        // ANIMATION LOOP
        // ============================================

        let frameCount = 0;
        let lastTime = performance.now();

        function animate(currentTime) {
            requestAnimationFrame(animate);

            // Step physics
            if (world) {
                world.step();

                // Sync Three.js meshes with physics bodies
                rigidBodies.forEach(({ mesh, body }) => {
                    const pos = body.translation();
                    const rot = body.rotation();

                    mesh.position.set(pos.x, pos.y, pos.z);
                    mesh.quaternion.set(rot.x, rot.y, rot.z, rot.w);
                });
            }

            // Render
            renderer.render(scene, camera);

            // FPS counter
            frameCount++;
            const elapsed = currentTime - lastTime;
            if (elapsed > 1000) {
                const fps = Math.round(frameCount * 1000 / elapsed);
                document.getElementById('fps').textContent = `FPS: ${fps}`;
                frameCount = 0;
                lastTime = currentTime;
            }
        }

        // ============================================
        // STARTUP
        // ============================================

        async function init() {
            await initPhysics();
            createTestScene();
            document.getElementById('loading').classList.add('hidden');
            animate(performance.now());
            console.log('Ready. Click objects to apply force!');
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
