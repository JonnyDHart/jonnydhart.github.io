<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcade Portfolio</title>
  <link rel="icon" href="favicon.ico" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background-color: #0a0a0a;
      overflow: hidden;
    }
    spline-viewer {
      width: 100%;
      height: 100%;
      display: block;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      box-shadow: inset 0 0 80px rgba(0, 255, 255, 0.1);
    }
    
    /* Navigation link */
    #nav {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
    }
    
    #nav a {
      display: inline-block;
      padding: 10px 20px;
      background: rgba(0, 255, 255, 0.1);
      border: 2px solid #00ffff;
      color: #00ffff;
      text-decoration: none;
      font-size: 14px;
      font-family: monospace;
      border-radius: 4px;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    
    #nav a:hover {
      background: rgba(0, 255, 255, 0.2);
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    }
  </style>
</head>
<body>
  <script type="module" src="https://unpkg.com/@splinetool/viewer@1.10.90/build/spline-viewer.js"></script>
  
  <spline-viewer url="https://prod.spline.design/LqqBZd1lVtFn5dBQ/scene.splinecode"></spline-viewer>
  
  <div id="nav">
    <a href="physics-viewer.html">→ Physics Demo</a>
  </div>
</body>
</html>
